[project]
name = "devenv-backend"
revision = "1.0"

# Default profile (applies to all profiles unless overridden)
[profiles.default]
# Database
DATABASE_URL = { description = "PostgreSQL connection string", required = false }

# Error Tracking
SENTRY_DSN = { description = "Sentry error tracking DSN", required = false }

# Analytics
POSTHOG_API_KEY = { description = "PostHog analytics API key", required = false }

# GitHub App (https://github.com/settings/apps)
GITHUB_APP_PRIVATE_KEY = { description = "GitHub App > General > Private keys > Generate", required = true }
GITHUB_WEBHOOK_SECRET = { description = "GitHub App > General > Webhook > Secret", required = true }

# GitHub OAuth (https://github.com/settings/apps)
GITHUB_OAUTH_CLIENT_ID = { description = "GitHub App > General > Client ID", required = true }
GITHUB_OAUTH_CLIENT_SECRET = { description = "GitHub App > General > Client secrets > Generate", required = true }

SESSION_SECRET = { description = "Secret key for encrypting session cookies", type = "hex", generate = { bytes = 64 } }

[profiles.staging]
DATABASE_URL = { required = false }

[profiles.production]
DATABASE_URL = { required = false }
SENTRY_DSN = { required = true }
POSTHOG_API_KEY = { required = true }
